name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets configured: the APK is signed with a temporary debug key."
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/meteo-trajet-v${VERSION_NAME}.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Version ${VERSION_NAME} (build ${VERSION_CODE})"
            echo
            echo "Commit: ${GITHUB_SHA::7}"
            echo
            if [ "$SIGNED_WITH" = "debug" ]; then
              echo "> Signed with a temporary debug key. Uninstall the previous version before installing this one."
            fi
            echo
            echo "## Changes"
            git log -1 --format='%s%n%n%b' "$GITHUB_SHA"
          } > notes.md
          gh release create "v${VERSION_NAME}" "dist/meteo-trajet-v${VERSION_NAME}.apk" \
            --title "Météo Trajet v${VERSION_NAME}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
